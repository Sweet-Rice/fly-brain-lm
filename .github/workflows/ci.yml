name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest + smoke (CPU torch)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/workflows/ci.yml
      - name: Install CPU PyTorch and project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy pandas pyarrow tiktoken websockets pytest
          python -c "import torch; print('torch', torch.__version__, 'cuda', torch.version.cuda)"
      - name: Tests
        run: python -m pytest -q test --durations=5
      - name: Smoke (init checkpoint, serve, record, inspect)
        run: .github/scripts/smoke.sh
